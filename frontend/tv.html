<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
      * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
         font-family: Arial, sans-serif;
      }

      body {
         background-color: #5c4033;
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
         overflow: hidden;
      }

      .tv-conteiner {
         display: flex;
         width: 95vw;
         height: 90vh;
         gap: 18px;

      }

      .left-panel {
         display: flex;
         flex-direction: column;
         width: 35%;
         gap: 18px;
      }

      .right-panel {
         display: flex;
         flex-direction: column;
         width: 65%;
         gap: 18px;
      }


      .box {
         background-color: #63d4f4;
         border: 6px solid #b39b82;
         border-radius: 15px;
         padding: 20px;
         display: flex;
         flex-direction: column;
         justify-content: center;
         align-items: center;
         text-align: center;
         box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3)
      }

      .box-title {
         color: #ffffff;
         font-size: 2.2vw;
         font-weight: bold;
         text-transform: uppercase;
         text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
         margin-bottom: 12px;
      }


      /* painel esquerdo - local (guiche ou consutório )  */


      .local-box {
         flex: 1;
      }

      .local-number {
         color: #d12c2c;
         font-size: 9vw;
         font-weight: bold;
         line-height: 1;

      }

      .local-type {
         color: #555;
         font-size: 1.8vw;
         font-weight: bold;
         margin-top: 6px;

      }

      /* historico */
      .history-box {
         flex: 1;
         justify-content: flex-start;
         align-items: flex-start;
      }

      .history-box .box-title {
         font-size: 1.8vw;
         align-items: center;
      }

      #history-list {
         list-style: none;
         width: 100%;
         color: #d12c2c;
         font-size: 1.5vw;
         font-weight: bold;
         text-align: left;

      }

      #history-list li {
         margin-bottom: 8px;
         border-bottom: 1px solid rgba(0, 0, 0, 0.3);
         padding-bottom: 5px;
      }

      /* PAINEL DIREITO - NOME DO PACIENTE */
      .patient-box {
         flex: 3;
      }

      .patient-name {
         color: #d12c2c;
         font-size: 6.5vw;
         font-weight: 1.2;
         word-break: break-word;
      }

      /* logo */
      .logo-box {
         flex: 1;
      }

      .logo-text {
         color: #8c3b7a;
         font-size: 3.5vw;
         font-weight: bold;
         text-transform: uppercase;

      }

      @keyframes flash {

         0%,
         100% {
            opacity: 1;
         }

         50% {
            opacity: 0.3;
         }
      }

      .flash {
         animation: flash 0.5 ease 3;
      }
   </style>
   <title>midia</title>
</head>

<body>
   <div class="tv-conteiner">
      <div class="left-panel">
         <div class="box local-box">
            <div class="box-title" id="local-tipo">"GUICHE"</div>
            <div class="local-number" id="local-numero">--</div>
         </div>
         <div class="box history-box">
            <div class="box-title"> ULTIMAS CHAMADAS</div>
            <ul id="history-list"></ul>
         </div>
      </div>
      <div class="right-panel">
         <div class="box patient-box">
            <div class="box-title">PACIENTE</div>
            <div class="patient-name" id="patient-name">AGUARDANDO...</div>
         </div>
         <div class="box logo-box">
            <div class="logo-text">🏥 Sistema Hospitalar</div>
         </div>
      </div>
   </div>
<script>
   let ultmolt = null;
   //funcao criada para busca a chamada atual e o
   //historico da tv em tempo real
   function atualizar() {
      fetch("/tv/chamada")
      .then(r => r.json())
      .then(data => {
         const chamada = data.chamada;
         const historico = data.historico || [];
         if (chamada) {
            document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÉ";
             document.getElementById("local-numero").innerText = chamada.numero || "--";
               document.getElementById("pacient-name").innerText = chamada.paciente || "AGUARDAMDO...";
            
             //flash visual quando ha chamda nova
             if (chamada.id !== ultimoId) {
              ultimoId= chamada.id;
             const patientBox = document.querySelector(".patient-box");
                patientBox.classList.remove(flash)
                void patientBox.offsetwidth; //reflow
             patientBox.classList.add("flash");
             }
         }
         //historico
         const list = document.getElementById("history-list")
         list.innerHTML = "";
         historico.slice(0, 4).forEach(h => {
            const li = document.createElement("li");
            const tipo= h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
            li.innerText = `${tipo}. ${h.localnumero} - ${h.paciente}`;
            li.appendChild(li);
         });
      })
      .catch(err => console.log(" erro ao buscar chamada ", err));
   }
   // polling a cada 2 segundo
   atualizar();
   setInterval(atualizar,2000);
</script>


</body>

</html>
